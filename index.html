<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Collection</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Game Collection</h1>
    <p>Track games you own, want, or are currently playing.</p>
  </header>

  <main>
    <section class="card">
      <h2>Add a Game</h2>

      <form id="gameForm">
        <label for="title">Game Title</label>
        <input type="text" id="title" required />

        <label for="platform">Platform</label>
        <select id="platform" required>
          <option value="">Choose a platform</option>
          <option value="PC">PC</option>
          <option value="PlayStation">PlayStation</option>
          <option value="Xbox">Xbox</option>
          <option value="Nintendo Switch">Nintendo Switch</option>
        </select>

        <label for="status">Status</label>
        <select id="status" required>
          <option value="">Choose a status</option>
          <option value="Playing">Playing</option>
          <option value="Completed">Completed</option>
          <option value="Want to Play">Want to Play</option>
        </select>

        <button type="submit">Add Game</button>
      </form>
    </section>

    <section class="card">
      <h2>Search and Filter</h2>

      <input type="text" id="searchInput" placeholder="Search by game title" />

      <select id="filterStatus">
        <option value="All">All Games</option>
        <option value="Playing">Playing</option>
        <option value="Completed">Completed</option>
        <option value="Want to Play">Want to Play</option>
      </select>
    </section>

    <section class="card">
      <h2>My Games</h2>
      <div id="gameList" class="game-list"></div>
      <button id="clearGames" class="danger">Clear All Games</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Tanner Tinsley</p>
  </footer>
</body>
</html>
